
name: Albion Online Research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: albion-research
  cancel-in-progress: false

jobs:
  research:
    name: Investigacion publica de Albion
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Comprobar Python
        run: python3 --version

      - name: Ejecutar investigacion y analisis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/albion_research.py

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: albion-research-report
          path: albion-research/
          if-no-files-found: warn
          retention-days: 14
