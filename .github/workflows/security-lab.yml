```yaml
name: Security Lab

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: Scan OWASP Juice Shop
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify scripts
        run: |
          test -f scripts/generate_report.py
          test -f scripts/compare_reports.py

      - name: Create lab network
        run: docker network create labnet

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            --network labnet \
            bkimminich/juice-shop

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if docker run --rm \
              --network labnet \
              curlimages/curl:latest \
              -fsS http://juice-shop:3000/ >/dev/null; then
              echo "Juice Shop está listo."
              exit 0
            fi
            sleep 2
          done
          echo "Juice Shop no respondió."
          exit 1

      - name: Prepare reports
        run: |
          mkdir -p reports
          chmod 777 reports

      - name: Run ZAP baseline scan
        continue-on-error: true
        run: |
          zap_exit=0
          docker run --rm \
            --network labnet \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop:3000 \
            -r report.html \
            -J report.json || zap_exit=$?

          echo "$zap_exit" > reports/zap-exit-code.txt

      - name: Generate Spanish report
        if: always()
        run: |
          python3 scripts/generate_report.py

      - name: Compare reports
        if: always()
        run: |
          python3 scripts/compare_reports.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-lab-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          docker rm -f juice-shop || true
          docker network rm labnet || true
```
