
name: Security Lab

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create isolated lab network
        run: docker network create labnet

      - name: Start training application
        run: |
          docker run -d \
            --name juice-shop \
            --network labnet \
            bkimminich/juice-shop

      - name: Wait for application
        run: |
          docker run --rm \
            --network labnet \
            --entrypoint sh \
            curlimages/curl:latest \
            -c 'for i in $(seq 1 30); do
            if curl -fsS http://juice-shop:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
            done
            exit 1'


      - name: Run passive security scan
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm \
            --network labnet \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop:3000 \
            -r report.html \
            -J report.json

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-lab-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          docker rm -f juice-shop || true
          docker network rm labnet || true
